name: AMANAH Model CI

on:
  push:
    branches: ["main"]
    paths:
      - "Amanah AI model/**"
      - ".github/workflows/model-ci.yml"
  pull_request:
    paths:
      - "Amanah AI model/**"
      - ".github/workflows/model-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Amanah AI model"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Amanah AI model/requirements.txt"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: pytest -q
